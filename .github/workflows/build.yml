name: Build saity_kernel.skprx

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Verifier le .skprx
        run: ls -l build/saity_kernel.skprx

      - name: Publier le .skprx
        uses: actions/upload-artifact@v4
        with:
          name: saity-kernel-skprx
          path: build/saity_kernel.skprx
